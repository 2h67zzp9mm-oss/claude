<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>The Blacksteel Pirates</title>
<meta name="description" content="Prologue game: The Island That Never Existed">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;1,400&family=IM+Fell+English+SC&family=IM+Fell+English:ital@1&display=swap">
<style>
  /* One deliberate look: a lamp-lit cabin at night. Same palette in light and dark hosts. */
  :root {
    color-scheme: dark;
    --ink: #10171d;
    --panel: #19222a;
    --panel-2: #212c35;
    --line: #34424d;
    --text: #e9e1d0;
    --muted: #a3a9a6;
    --parchment: #ecdfc2;
    --lamp: #eaa94c;
    --brass: #b38e50;
    --radio: #86c0b4;
    --ember: #cf5a3a;
    --display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
    --narrate: "IM Fell English", "Iowan Old Style", Georgia, serif;
    --body: "Alegreya", "Iowan Old Style", Georgia, serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    background: var(--ink);
    color: var(--text);
    font: 17px/1.5 var(--body);
    padding-inline: 16px;
  }
  #app {
    max-width: 960px;
    margin: 0 auto;
    padding-block: 12px 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  /* On phones, the whole game must fit one screen with no scrolling: landscape gives enough
     width for the 3D stage plus the dialogue/inventory panel side by side. Portrait doesn't have
     room for both, so we ask for a rotate instead of cramming everything into a tall, scrolling page. */
  #rotate {
    display: none;
    position: fixed; inset: 0; z-index: 50;
    background: var(--ink);
    color: var(--text);
    flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 24px;
  }
  #rotate .icon { font-size: 48px; animation: tilt 1.6s ease-in-out infinite; }
  @keyframes tilt { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
  #rotate p { margin: 0; font: 18px/1.4 var(--body); color: var(--parchment); max-width: 32ch; }
  @media (orientation: portrait) and (max-width: 900px) {
    #rotate { display: flex; }
    #app { display: none; }
  }
  @media (max-height: 520px) and (orientation: landscape) {
    html, body { height: 100dvh; overflow: hidden; }
    body { padding-inline: 0; }
    /* The 3D stage fills the screen; everything else is a slim overlay HUD on top of it, not a
       side column eating almost half the width. Inventory and hotspots are hidden behind two
       small buttons (Look / Inventory) and slide up as sheets only when opened, instead of
       always taking up their own strip of screen. */
    #app { height: 100dvh; max-height: 100dvh; padding: 0; gap: 0; max-width: none; position: relative; display: block; }
    header.bar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 8;
      padding: 4px 8px; background: linear-gradient(rgba(6,9,12,.8), transparent);
      flex-wrap: wrap;
    }
    header.bar h1 { font-size: 14px; }
    header.bar .where { display: none; }
    .tools button { padding: 5px 9px; font-size: 13px; }
    #stage { position: absolute; inset: 0; width: 100%; height: 100%; max-height: 100%; aspect-ratio: auto; border: none; border-radius: 0; }
    /* No big panel behind the dialogue: the 3D scene should read as the whole screen. Only the
       text itself gets a small, tight backdrop (see .said, #choices button below) so it stays
       legible over whatever's happening behind it. */
    #box {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
      max-height: 40dvh; overflow-y: auto; padding: 8px 10px 6px;
      background: none; border: none; border-radius: 0; pointer-events: none;
    }
    #box * { pointer-events: auto; }
    #box .said { background: rgba(10,14,18,.72); backdrop-filter: blur(2px); border-radius: 8px; padding: 6px 10px; display: inline-flex; flex-direction: column; }
    #box #choices { align-items: flex-start; }
    #box #choices button { background: rgba(10,14,18,.82); }
    #box #tap { background: rgba(10,14,18,.72); border-radius: 6px; padding: 2px 8px; align-self: flex-end; }
    #chips, #inv {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 9;
      max-height: 45dvh; overflow-y: auto; margin: 0; padding: 10px 10px calc(10px + env(safe-area-inset-bottom, 0px));
      background: rgba(14,20,26,.98); border-top: 1px solid var(--brass);
      transform: translateY(100%); transition: transform .18s ease;
    }
    #chips.open, #inv.open { transform: translateY(0); }
    #portrait, .face { width: 40px; height: 40px; }
    #line { font-size: 15px; }
    #choices button { padding: 6px 9px; font-size: 14px; }
  }
  header.bar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  header.bar h1 {
    margin: 0;
    font: 22px/1.1 var(--display);
    letter-spacing: .04em;
    color: var(--parchment);
  }
  header.bar .where {
    font-size: 14px;
    color: var(--muted);
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .tools { display: flex; gap: 8px; align-items: center; }
  #optionsBtn { display: none; }
  #optionsPanel { display: flex; gap: 8px; }
  /* Placed after the rules above (not inside the earlier mobile-landscape block) so it actually
     wins the cascade: a later same-specificity rule beats an earlier one even across media
     queries. Voice/Auto/Hint/Menu collapse behind one Options button here, same idea as Look
     and Inventory, so the header stays a single row instead of wrapping across the stage. */
  @media (max-height: 520px) and (orientation: landscape) {
    #optionsBtn { display: inline-block; }
    #optionsPanel {
      /* fixed, not absolute: it's nested inside header.bar (itself position:absolute), so an
         absolute position here would anchor to the header bar's own box, not the screen. */
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
      flex-wrap: wrap; margin: 0; padding: 10px 10px calc(10px + env(safe-area-inset-bottom, 0px));
      background: rgba(14,20,26,.98); border-top: 1px solid var(--brass);
      transform: translateY(100%); transition: transform .18s ease;
    }
    #optionsPanel.open { transform: translateY(0); }
  }
  button {
    font: 600 15px/1 var(--body);
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 9px 14px;
    cursor: pointer;
  }
  button:hover { border-color: var(--brass); }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

  #stage {
    position: relative;
    width: 100%;
    max-width: 100%;
    aspect-ratio: 800 / 480;
    background: #07090b;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    touch-action: manipulation;
  }
  #world { position: absolute; inset: 0; transform-origin: 50% 58%; }
  #world > * { position: absolute; inset: 0; width: 100%; height: 100%; }
  #world img.bg { object-fit: cover; opacity: 0; transition: opacity .45s ease; pointer-events: none; }
  #fxN, #chr, #fxL { pointer-events: none; }
  #fxL { mix-blend-mode: screen; }
  #cabin3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #grade {
    pointer-events: none;
    mix-blend-mode: soft-light;
    background: linear-gradient(180deg, rgba(88,52,140,.7), rgba(24,14,40,.35) 55%, rgba(176,120,52,.45));
  }
  #world img.bg.painted { filter: saturate(.82) contrast(1.14) brightness(.9); }
  #ov svg { display: block; width: 100%; height: 100%; }
  #stage [data-hs] { cursor: pointer; fill: transparent; stroke: none; }
  #stage [data-hs].glow {
    stroke: var(--lamp);
    stroke-width: 3;
    stroke-dasharray: 8 6;
    animation: march 1.2s linear infinite;
  }
  @keyframes march { to { stroke-dashoffset: -28; } }
  .blink { animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  .fadein { animation: fade .6s ease-out; }
  @keyframes fade { from { opacity: .2; } to { opacity: 1; } }

  #verbs {
    position: absolute;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 6px;
    background: rgba(16, 23, 29, .94);
    border: 1px solid var(--brass);
    border-radius: 8px;
    z-index: 5;
    min-width: 120px;
  }
  #verbs .vname {
    font: 13px/1.2 var(--body);
    color: var(--lamp);
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 2px 6px 4px;
  }
  #verbs button { text-align: left; padding: 8px 10px; }

  #box {
    min-height: 132px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    cursor: default;
  }
  #box.waiting { cursor: pointer; }
  .speaker { display: flex; gap: 14px; align-items: flex-start; }
  .said { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  #portrait, .face {
    flex: none;
    width: 84px;
    height: 84px;
    border-radius: 8px;
    border: 2px solid var(--brass);
    background-repeat: no-repeat;
    background-color: #0b1116;
    box-shadow: 0 2px 10px rgba(0,0,0,.5);
  }
  #title .face { width: 96px; height: 112px; align-self: center; }
  @media (max-width: 520px) { #portrait { width: 64px; height: 64px; } #title .face { width: 64px; height: 76px; } }
  #who {
    font: 600 13px/1 var(--body);
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    min-height: 13px;
  }
  #who.N { color: var(--lamp); }
  #who.R { color: var(--radio); }
  #who.S { color: var(--parchment); }
  #who.SIS { color: #d6a7c4; }
  #line { margin: 0; max-width: 65ch; font-size: 18px; }
  #line.N { font-family: var(--narrate); font-style: italic; font-size: 19px; }
  #line.CAP { font-family: var(--narrate); font-style: italic; font-size: 20px; color: var(--parchment); }
  #line.R::before { content: "\201C"; }
  #line.R::after { content: "\201D"; }
  #tap { font-size: 13px; color: var(--muted); align-self: flex-end; }
  #choices { display: flex; flex-direction: column; gap: 6px; }
  #choices button { text-align: left; font-weight: 400; font-size: 17px; line-height: 1.35; padding: 10px 12px; }
  #choices button .k { color: var(--lamp); font-weight: 600; margin-right: 8px; }

  #inv {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    min-height: 44px;
  }
  #inv .label { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  #inv button { font-weight: 400; }
  #inv button.sel { border-color: var(--lamp); color: var(--lamp); }
  #inv .empty { color: var(--muted); font-style: italic; font-size: 15px; }

  /* Title screen */
  #title {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 16px;
    justify-content: flex-end !important;
    padding-bottom: 5% !important;
    background: linear-gradient(rgba(4,8,14,0) 35%, rgba(4,8,14,.88));
    /* Higher than every mobile-landscape HUD overlay (box/chips/inv/header all sit at 6-9) so the
       title screen's own buttons are always clickable on top of them, not blocked underneath. */
    z-index: 20;
  }
  #title h2 {
    margin: 0;
    font: clamp(28px, 7vw, 56px)/1 var(--display);
    color: var(--parchment);
    letter-spacing: .03em;
    text-wrap: balance;
  }
  #title .sub {
    font: italic clamp(15px, 3vw, 20px)/1.3 var(--narrate);
    color: var(--lamp);
  }
  #title .who { margin-top: 8px; font-size: 15px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  #title .players { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  #title .p { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  #title .p button.big { font: 22px/1 var(--display); padding: 12px 26px; background: #2a2016; border-color: var(--brass); color: var(--parchment); }
  #title .p button.small { font-size: 13px; padding: 6px 10px; color: var(--muted); }
  #title .p button.small.cont { color: var(--parchment); border-color: var(--brass); font-size: 14px; }
  #title .note { margin-top: 10px; max-width: 46ch; font-size: 13px; line-height: 1.4; color: var(--muted); font-style: italic; }

  @media (max-width: 520px) {
    #title .sub { display: none; }
    header.bar .where { display: none; }
    #title .p button.big { font-size: 19px; padding: 10px 18px; }
    #line { font-size: 17px; }
    #line.N { font-size: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #stage [data-hs].glow, .blink { animation: none; }
    #world img.bg { transition: none; }
  }
  #world3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #flash3d { position: absolute; inset: 0; pointer-events: none; opacity: 0; z-index: 4; }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #chips .label { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  #chips button { font-weight: 400; font-size: 14px; padding: 7px 10px; background: transparent; }
  #steer { position: absolute; inset: auto 0 12px 0; display: flex; justify-content: space-between; padding-inline: 12px; z-index: 5; pointer-events: none; }
  #steer button { pointer-events: auto; font: 28px/1 var(--display); width: 72px; height: 56px; background: rgba(16,23,29,.75); border-color: var(--brass); color: var(--parchment); }
  #closeupExit { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 5; background: rgba(16,23,29,.88); border-color: var(--brass); color: var(--parchment); }
  #paper {
    position: absolute; inset: 4% 10%; z-index: 6; overflow: auto;
    background: #e9e1cc; color: #1d1812; border-radius: 3px; padding: 14px 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,.6); font-family: Georgia, "Times New Roman", serif; cursor: pointer;
  }
  #paper .mast { text-align: center; font: 13px/1 var(--display); letter-spacing: .3em; border-bottom: 3px double #1d1812; padding-bottom: 6px; }
  #paper h3 { margin: 10px 0 6px; font: 900 clamp(18px, 4vw, 34px)/1.05 Georgia, serif; text-align: center; letter-spacing: .01em; text-wrap: balance; }
  #paper .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 13px; line-height: 1.35; }
  #paper .pic { aspect-ratio: 4/3; background: radial-gradient(ellipse at 45% 60%, #2a2530 0 18%, transparent 40%), linear-gradient(160deg, #6a6258, #1f1c19); filter: grayscale(1) blur(.6px); position: relative; }
  #paper .pic::after { content: ""; position: absolute; left: 20%; right: 5%; top: 40%; height: 14%; border-top: 10px solid #0b0a0a; border-radius: 50% 50% 0 0; transform: rotate(-14deg); }
  #paper .bounty { margin-top: 10px; border: 2px solid #1d1812; text-align: center; padding: 8px; font: 700 15px/1.3 Georgia, serif; }
  #paper .bounty b { display: block; font-size: clamp(20px, 4.5vw, 32px); letter-spacing: .04em; }
  @media (max-width: 520px) { #paper { inset: 2%; } #paper .cols { grid-template-columns: 1fr; } }
  #voiceBtn[aria-pressed="true"], #autoBtn[aria-pressed="true"] { border-color: var(--lamp); color: var(--lamp); }
</style>

<div id="rotate" aria-hidden="true">
  <div class="icon">&#128241;</div>
  <p>Turn your phone sideways to play &mdash; the ship's too big for a portrait screen.</p>
</div>
<div id="app">
  <header class="bar">
    <h1>The Blacksteel Pirates</h1>
    <div class="tools">
      <span class="where" id="where"></span>
      <button id="optionsBtn" type="button" aria-pressed="false">Options</button>
      <div id="optionsPanel">
        <button id="voiceBtn" type="button" aria-pressed="true" title="Voices read the story aloud">Voice</button>
        <button id="autoBtn" type="button" aria-pressed="false" title="Turn the page when each line finishes">Auto</button>
        <button id="hintBtn" type="button" hidden>Hint</button>
        <button id="menuBtn" type="button" hidden>Menu</button>
      </div>
      <button id="lookBtn" type="button" hidden aria-pressed="false">&#128065; Look</button>
      <button id="invBtn" type="button" hidden aria-pressed="false">Inventory</button>
      <button id="showAllBtn" type="button" hidden title="Highlight everything you haven't tried yet">?</button>
    </div>
  </header>
  <div id="stage">
    <div id="title" hidden></div>
    <div id="steer" hidden><button type="button" id="steerL" aria-label="Steer left">&#9664;</button><button type="button" id="steerR" aria-label="Steer right">&#9654;</button></div>
    <div id="paper" hidden></div>
    <button id="closeupExit" type="button" hidden>&#8592; Step back</button>
  </div>
  <section id="box" aria-live="polite">
    <div class="speaker">
      <div id="portrait" hidden></div>
      <div class="said">
        <div id="who"></div>
        <p id="line"></p>
      </div>
    </div>
    <div id="choices"></div>
    <div id="tap" hidden>Tap to continue</div>
  </section>
  <div id="chips" hidden></div>
  <div id="inv" hidden></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="people3d.js"></script>
<script src="world3d.js"></script>
<script src="sets3d.js"></script>
<script src="art.js"></script>
<script src="story.js"></script>
<script>
(() => {
  "use strict";

  // ---------- state and saves ----------
  const S = { player: null, ch: 0, stage: 0, flags: {}, inv: [], busy: false, sel: null };
  window.__bsp = S;
  const NAMES = { olive: "Olive", hazel: "Hazel" };
  const me = () => NAMES[S.player];
  const sis = () => (S.player === "olive" ? "Hazel" : "Olive");
  const saveKey = p => "blacksteel.prologue.v2." + p;
  // A save is the chapter reached plus an optional checkpoint inside it (so a long chapter doesn't start over).
  function save() { if (!S.player) return; try { localStorage.setItem(saveKey(S.player), JSON.stringify({ ch: S.ch, cp: S.cp || null })); } catch (e) { /* no storage: play on */ } }
  function load(p) {
    try {
      const sv = JSON.parse(localStorage.getItem(saveKey(p)) || "null");
      if (sv) return sv;
      // Saves from the first version of the game (Chapter One only).
      const old = JSON.parse(localStorage.getItem("blacksteel.prologue." + p) || "null");
      if (old && old.part === "end") return { ch: 1, cp: null };
      if (old && old.part === "cabin") return { ch: 0, cp: "cabin" };
      return null;
    } catch (e) { return null; }
  }
  function wipe(p) { try { localStorage.removeItem(saveKey(p)); localStorage.removeItem("blacksteel.prologue." + p); } catch (e) { /* ignore */ } }
  const pref = (k, d) => { try { const v = localStorage.getItem("blacksteel.pref." + k); return v === null ? d : v === "1"; } catch (e) { return d; } };
  const setPref = (k, v) => { try { localStorage.setItem("blacksteel.pref." + k, v ? "1" : "0"); } catch (e) { /* ignore */ } };

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const stage = $("stage"), box = $("box"), who = $("who"), line = $("line"), choices = $("choices"), tap = $("tap"),
        inv = $("inv"), chips = $("chips"), title = $("title"), hintBtn = $("hintBtn"), menuBtn = $("menuBtn"),
        where = $("where"), portrait = $("portrait"), steerEl = $("steer"), paper = $("paper"),
        voiceBtn = $("voiceBtn"), autoBtn = $("autoBtn"), closeupExit = $("closeupExit"),
        lookBtn = $("lookBtn"), invBtn = $("invBtn"), optionsBtn = $("optionsBtn"), optionsPanel = $("optionsPanel"),
        showAllBtn = $("showAllBtn");

  // On the cramped mobile-landscape layout, Inventory, "Things here", and Voice/Auto/Hint/Menu
  // are all hidden sheets that slide up from three small header buttons instead of always eating
  // their own strip of screen. Elsewhere (desktop, portrait-blocked) these buttons are never shown
  // (see #optionsBtn/#lookBtn/#invBtn's default display:none), so this is inert outside mobile.
  function closeSheets() {
    chips.classList.remove("open"); inv.classList.remove("open"); optionsPanel.classList.remove("open");
    lookBtn.setAttribute("aria-pressed", "false"); invBtn.setAttribute("aria-pressed", "false"); optionsBtn.setAttribute("aria-pressed", "false");
  }
  function toggleSheet(btn, el) { const open = !el.classList.contains("open"); closeSheets(); if (open) { el.classList.add("open"); btn.setAttribute("aria-pressed", "true"); } }
  lookBtn.addEventListener("click", e => { e.stopPropagation(); toggleSheet(lookBtn, chips); });
  invBtn.addEventListener("click", e => { e.stopPropagation(); toggleSheet(invBtn, inv); });
  optionsBtn.addEventListener("click", e => { e.stopPropagation(); toggleSheet(optionsBtn, optionsPanel); });

  ART.mount(stage);
  const world2d = stage.querySelector("#world");
  const W = window.WORLD && window.WORLD.init(stage) ? window.WORLD : null;
  // Chapters call G.W freely; without 3D these calls do nothing.
  const W0 = { ok: false, goTo: async () => {}, gesture: async () => {}, faceTo() {}, ev: async () => {}, shake() {}, flash() {}, fade: async () => {}, actor: () => null, player: null, setGlow() {}, hotspots: () => [], refresh() {} };
  const GW = () => (W && W.active ? W : W0);

  // ---------- voices ----------
  // Every line is recorded ahead of time (voices/generate.py) and packed into one file per chapter.
  // voices/manifest.json maps "<voice>|<exact text>" to [chapter, start, duration].
  const VOICE_OF = { N: "Shannon", R: "Shannon", CAP: "Narrator", S: "Sean", Deke: "Deke", Mercer: "Mercer", Nia: "Nia", Harrow: "Harrow", Lily: "Lily", "Lily's mother": "LilyMother" };
  const VO = { manifest: null, ctx: null, buffers: {}, src: null, chapters: new Set() };
  let voiceOn = pref("voice", true), autoOn = pref("auto", false);
  voiceBtn.setAttribute("aria-pressed", String(voiceOn));
  autoBtn.setAttribute("aria-pressed", String(autoOn));
  voiceBtn.hidden = true;

  let gen = 0;
  function begin(p, restart) {
    if (restart) wipe(p);
    // Browsers only allow sound after a tap: this tap unlocks it.
    voCtx();
    S.player = p;
    const sv = load(p);
    S.ch = sv && sv.ch < STORY.length ? sv.ch : 0;
    S.cp = sv && sv.ch < STORY.length ? sv.cp || null : null;
    S.stage = 0; S.flags = {}; S.inv = [];
    title.hidden = true; box.hidden = false; menuBtn.hidden = false;
    const mine = ++gen;
    runStory().catch(err => { if (mine === gen) { console.error(err); idleText("Something went wrong. Tap Menu to go back."); } });
  }
  menuBtn.addEventListener("click", () => { gen++; finishPlay = null; finish(); showTitle(); });

  ART.preload();
  showTitle();
})();
</script>
