<title>The Blacksteel Pirates</title>
<meta name="description" content="Prologue game: The Island That Never Existed">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;1,400&family=IM+Fell+English+SC&family=IM+Fell+English:ital@1&display=swap">
<style>
  /* One deliberate look: a lamp-lit cabin at night. Same palette in light and dark hosts. */
  :root {
    color-scheme: dark;
    --ink: #10171d;
    --panel: #19222a;
    --panel-2: #212c35;
    --line: #34424d;
    --text: #e9e1d0;
    --muted: #a3a9a6;
    --parchment: #ecdfc2;
    --lamp: #eaa94c;
    --brass: #b38e50;
    --radio: #86c0b4;
    --ember: #cf5a3a;
    --display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
    --narrate: "IM Fell English", "Iowan Old Style", Georgia, serif;
    --body: "Alegreya", "Iowan Old Style", Georgia, serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--text);
    font: 17px/1.5 var(--body);
    padding-inline: 16px;
  }
  #app {
    max-width: 960px;
    margin: 0 auto;
    padding-block: 12px 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  header.bar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  header.bar h1 {
    margin: 0;
    font: 22px/1.1 var(--display);
    letter-spacing: .04em;
    color: var(--parchment);
  }
  header.bar .where {
    font-size: 14px;
    color: var(--muted);
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .tools { display: flex; gap: 8px; }
  button {
    font: 600 15px/1 var(--body);
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 9px 14px;
    cursor: pointer;
  }
  button:hover { border-color: var(--brass); }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

  #stage {
    position: relative;
    width: 100%;
    max-width: 100%;
    aspect-ratio: 800 / 480;
    background: #07090b;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    touch-action: manipulation;
  }
  #world { position: absolute; inset: 0; transform-origin: 50% 58%; }
  #world > * { position: absolute; inset: 0; width: 100%; height: 100%; }
  #world img.bg { object-fit: cover; opacity: 0; transition: opacity .45s ease; pointer-events: none; }
  #fxN, #chr, #fxL { pointer-events: none; }
  #fxL { mix-blend-mode: screen; }
  #cabin3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #grade {
    pointer-events: none;
    mix-blend-mode: soft-light;
    background: linear-gradient(180deg, rgba(88,52,140,.7), rgba(24,14,40,.35) 55%, rgba(176,120,52,.45));
  }
  #world img.bg.painted { filter: saturate(.82) contrast(1.14) brightness(.9); }
  #ov svg { display: block; width: 100%; height: 100%; }
  #stage [data-hs] { cursor: pointer; fill: transparent; stroke: none; }
  #stage [data-hs].glow {
    stroke: var(--lamp);
    stroke-width: 3;
    stroke-dasharray: 8 6;
    animation: march 1.2s linear infinite;
  }
  @keyframes march { to { stroke-dashoffset: -28; } }
  .blink { animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  .fadein { animation: fade .6s ease-out; }
  @keyframes fade { from { opacity: .2; } to { opacity: 1; } }

  #verbs {
    position: absolute;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 6px;
    background: rgba(16, 23, 29, .94);
    border: 1px solid var(--brass);
    border-radius: 8px;
    z-index: 5;
    min-width: 120px;
  }
  #verbs .vname {
    font: 13px/1.2 var(--body);
    color: var(--lamp);
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 2px 6px 4px;
  }
  #verbs button { text-align: left; padding: 8px 10px; }

  #box {
    min-height: 132px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    cursor: default;
  }
  #box.waiting { cursor: pointer; }
  .speaker { display: flex; gap: 14px; align-items: flex-start; }
  .said { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  #portrait, .face {
    flex: none;
    width: 84px;
    height: 84px;
    border-radius: 8px;
    border: 2px solid var(--brass);
    background-repeat: no-repeat;
    background-color: #0b1116;
    box-shadow: 0 2px 10px rgba(0,0,0,.5);
  }
  #title .face { width: 96px; height: 112px; align-self: center; }
  @media (max-width: 520px) { #portrait { width: 64px; height: 64px; } #title .face { width: 64px; height: 76px; } }
  #who {
    font: 600 13px/1 var(--body);
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    min-height: 13px;
  }
  #who.N { color: var(--lamp); }
  #who.R { color: var(--radio); }
  #who.S { color: var(--parchment); }
  #who.SIS { color: #d6a7c4; }
  #line { margin: 0; max-width: 65ch; font-size: 18px; }
  #line.N { font-family: var(--narrate); font-style: italic; font-size: 19px; }
  #line.CAP { font-family: var(--narrate); font-style: italic; font-size: 20px; color: var(--parchment); }
  #line.R::before { content: "\201C"; }
  #line.R::after { content: "\201D"; }
  #tap { font-size: 13px; color: var(--muted); align-self: flex-end; }
  #choices { display: flex; flex-direction: column; gap: 6px; }
  #choices button { text-align: left; font-weight: 400; font-size: 17px; line-height: 1.35; padding: 10px 12px; }
  #choices button .k { color: var(--lamp); font-weight: 600; margin-right: 8px; }

  #inv {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    min-height: 44px;
  }
  #inv .label { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  #inv button { font-weight: 400; }
  #inv button.sel { border-color: var(--lamp); color: var(--lamp); }
  #inv .empty { color: var(--muted); font-style: italic; font-size: 15px; }

  /* Title screen */
  #title {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 16px;
    justify-content: flex-end !important;
    padding-bottom: 5% !important;
    background: linear-gradient(rgba(4,8,14,0) 35%, rgba(4,8,14,.88));
    z-index: 6;
  }
  #title h2 {
    margin: 0;
    font: clamp(28px, 7vw, 56px)/1 var(--display);
    color: var(--parchment);
    letter-spacing: .03em;
    text-wrap: balance;
  }
  #title .sub {
    font: italic clamp(15px, 3vw, 20px)/1.3 var(--narrate);
    color: var(--lamp);
  }
  #title .who { margin-top: 8px; font-size: 15px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  #title .players { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  #title .p { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  #title .p button.big { font: 22px/1 var(--display); padding: 12px 26px; background: #2a2016; border-color: var(--brass); color: var(--parchment); }
  #title .p button.small { font-size: 13px; padding: 6px 10px; color: var(--muted); }

  @media (max-width: 520px) {
    #title .sub { display: none; }
    header.bar .where { display: none; }
    #title .p button.big { font-size: 19px; padding: 10px 18px; }
    #line { font-size: 17px; }
    #line.N { font-size: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #stage [data-hs].glow, .blink { animation: none; }
    #world img.bg { transition: none; }
  }
  #world3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #flash3d { position: absolute; inset: 0; pointer-events: none; opacity: 0; z-index: 4; }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #chips .label { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  #chips button { font-weight: 400; font-size: 14px; padding: 7px 10px; background: transparent; }
  #steer { position: absolute; inset: auto 0 12px 0; display: flex; justify-content: space-between; padding-inline: 12px; z-index: 5; pointer-events: none; }
  #steer button { pointer-events: auto; font: 28px/1 var(--display); width: 72px; height: 56px; background: rgba(16,23,29,.75); border-color: var(--brass); color: var(--parchment); }
  #paper {
    position: absolute; inset: 4% 10%; z-index: 6; overflow: auto;
    background: #e9e1cc; color: #1d1812; border-radius: 3px; padding: 14px 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,.6); font-family: Georgia, "Times New Roman", serif; cursor: pointer;
  }
  #paper .mast { text-align: center; font: 13px/1 var(--display); letter-spacing: .3em; border-bottom: 3px double #1d1812; padding-bottom: 6px; }
  #paper h3 { margin: 10px 0 6px; font: 900 clamp(18px, 4vw, 34px)/1.05 Georgia, serif; text-align: center; letter-spacing: .01em; text-wrap: balance; }
  #paper .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 13px; line-height: 1.35; }
  #paper .pic { aspect-ratio: 4/3; background: radial-gradient(ellipse at 45% 60%, #2a2530 0 18%, transparent 40%), linear-gradient(160deg, #6a6258, #1f1c19); filter: grayscale(1) blur(.6px); position: relative; }
  #paper .pic::after { content: ""; position: absolute; left: 20%; right: 5%; top: 40%; height: 14%; border-top: 10px solid #0b0a0a; border-radius: 50% 50% 0 0; transform: rotate(-14deg); }
  #paper .bounty { margin-top: 10px; border: 2px solid #1d1812; text-align: center; padding: 8px; font: 700 15px/1.3 Georgia, serif; }
  #paper .bounty b { display: block; font-size: clamp(20px, 4.5vw, 32px); letter-spacing: .04em; }
  @media (max-width: 520px) { #paper { inset: 2%; } #paper .cols { grid-template-columns: 1fr; } }
  #voiceBtn[aria-pressed="true"], #autoBtn[aria-pressed="true"] { border-color: var(--lamp); color: var(--lamp); }
</style>

<div id="app">
  <header class="bar">
    <h1>The Blacksteel Pirates</h1>
    <div class="tools">
      <span class="where" id="where"></span>
      <button id="voiceBtn" type="button" aria-pressed="true" title="Voices read the story aloud">Voice</button>
      <button id="autoBtn" type="button" aria-pressed="false" title="Turn the page when each line finishes">Auto</button>
      <button id="hintBtn" type="button" hidden>Hint</button>
      <button id="menuBtn" type="button" hidden>Menu</button>
    </div>
  </header>
  <div id="stage">
    <div id="title" hidden></div>
    <div id="steer" hidden><button type="button" id="steerL" aria-label="Steer left">&#9664;</button><button type="button" id="steerR" aria-label="Steer right">&#9654;</button></div>
    <div id="paper" hidden></div>
  </div>
  <section id="box" aria-live="polite">
    <div class="speaker">
      <div id="portrait" hidden></div>
      <div class="said">
        <div id="who"></div>
        <p id="line"></p>
      </div>
    </div>
    <div id="choices"></div>
    <div id="tap" hidden>Tap to continue</div>
  </section>
  <div id="chips" hidden></div>
  <div id="inv" hidden></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="people3d.js"></script>
<script src="world3d.js"></script>
<script src="sets3d.js"></script>
<script src="art.js"></script>
<script src="story.js"></script>
<script>
(() => {
  "use strict";

  // ---------- state and saves ----------
  const S = { player: null, ch: 0, stage: 0, flags: {}, inv: [], busy: false, sel: null };
  window.__bsp = S;
  const NAMES = { olive: "Olive", hazel: "Hazel" };
  const me = () => NAMES[S.player];
  const sis = () => (S.player === "olive" ? "Hazel" : "Olive");
  const saveKey = p => "blacksteel.prologue.v2." + p;
  function save() { if (!S.player) return; try { localStorage.setItem(saveKey(S.player), JSON.stringify({ ch: S.ch })); } catch (e) { /* no storage: play on */ } }
  function load(p) { try { return JSON.parse(localStorage.getItem(saveKey(p)) || "null"); } catch (e) { return null; } }
  function wipe(p) { try { localStorage.removeItem(saveKey(p)); } catch (e) { /* ignore */ } }
  const pref = (k, d) => { try { const v = localStorage.getItem("blacksteel.pref." + k); return v === null ? d : v === "1"; } catch (e) { return d; } };
  const setPref = (k, v) => { try { localStorage.setItem("blacksteel.pref." + k, v ? "1" : "0"); } catch (e) { /* ignore */ } };

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const stage = $("stage"), box = $("box"), who = $("who"), line = $("line"), choices = $("choices"), tap = $("tap"),
        inv = $("inv"), chips = $("chips"), title = $("title"), hintBtn = $("hintBtn"), menuBtn = $("menuBtn"),
        where = $("where"), portrait = $("portrait"), steerEl = $("steer"), paper = $("paper"),
        voiceBtn = $("voiceBtn"), autoBtn = $("autoBtn");

  ART.mount(stage);
  const world2d = stage.querySelector("#world");
  const W = window.WORLD && window.WORLD.init(stage) ? window.WORLD : null;
  // Chapters call G.W freely; without 3D these calls do nothing.
  const W0 = { ok: false, goTo: async () => {}, gesture: async () => {}, faceTo() {}, ev: async () => {}, shake() {}, flash() {}, fade: async () => {}, actor: () => null, player: null, setGlow() {}, hotspots: () => [], refresh() {} };
  const GW = () => (W && W.active ? W : W0);

  // ---------- voices ----------
  const synth = window.speechSynthesis;
  let voiceOn = pref("voice", true) && !!synth, autoOn = pref("auto", false);
  voiceBtn.setAttribute("aria-pressed", String(voiceOn));
  autoBtn.setAttribute("aria-pressed", String(autoOn));
  if (!synth) voiceBtn.hidden = true;
  let voices = [];
  const FEMALE = /female|samantha|victoria|karen|moira|tessa|fiona|zira|susan|serena|allison|ava|kate|hazel|libby|sonia|jenny|aria|emma|amelie|nicky|martha|catherine|google uk english female|google us english/i;
  const MALE = /(^|\W)male|daniel|alex|fred|arthur|oliver|david|mark|george|rishi|aaron|tom|james|guy|ryan|thomas|lee|google uk english male/i;
  function pickVoices() {
    const all = synth ? synth.getVoices().filter(v => /^en/i.test(v.lang)) : [];
    const f = all.filter(v => FEMALE.test(v.name) && !/male/i.test(v.name.replace(/female/i, "")));
    const m = all.filter(v => MALE.test(v.name) && !FEMALE.test(v.name));
    const any = all.length ? all : (synth ? synth.getVoices() : []);
    const gb = list => list.find(v => /GB|UK/i.test(v.lang + v.name)) || list[0];
    voices = { f1: gb(f) || any[0], f2: f[1] || f[0] || any[0], m1: gb(m) || m[0] || any[0], m2: m[1] || m[0] || any[0], m3: m[2] || m[0] || any[0] };
  }
  if (synth) { pickVoices(); synth.onvoiceschanged = pickVoices; }
  // Who sounds like what: a voice, a pitch and a pace for each speaker.
  const CAST = {
    N: ["f1", 1, .95], R: ["f1", 1.05, 1], CAP: ["f1", .95, .9], S: ["m1", .95, 1],
    Deke: ["m2", 1.05, 1.02], Mercer: ["m3", .75, .9], Nia: ["f2", 1.15, 1.05], Harrow: ["m1", .6, .85],
    Lily: ["f2", 1.6, 1.05], "Lily's mother": ["f2", 1.1, 1], Olive: ["f2", 1.25, 1], Hazel: ["f1", 1.55, 1.05]
  };
  function speak(sp, text) {
    if (!voiceOn || !synth || !text) return Promise.resolve();
    const key = sp === "SIS" ? sis() : sp;
    const [v, pitch, rate] = CAST[key] || ["f2", 1, 1];
    const u = new SpeechSynthesisUtterance(text.replace(/[“”"]/g, "").replace(/’/g, "'"));
    if (voices[v]) u.voice = voices[v];
    u.pitch = pitch; u.rate = rate;
    return new Promise(res => { u.onend = u.onerror = () => res(); synth.cancel(); synth.speak(u); });
  }
  const hush = () => { if (synth) synth.cancel(); };
  voiceBtn.addEventListener("click", () => { voiceOn = !voiceOn; setPref("voice", voiceOn); voiceBtn.setAttribute("aria-pressed", String(voiceOn)); if (!voiceOn) hush(); });
  autoBtn.addEventListener("click", () => { autoOn = !autoOn; setPref("auto", autoOn); autoBtn.setAttribute("aria-pressed", String(autoOn)); });

  // ---------- dialogue ----------
  const LABEL = { N: () => "Shannon", R: () => "Shannon · over the communicator", S: () => "Sean", SIS: () => sis(), CAP: () => "", Harrow: () => "Harrow · field voice projector" };
  const PORTRAITS = {
    Hazel: { src: "art/hazel.webp", size: "300% auto", pos: "50% 24%" },
    Olive: { src: "art/olive_face.jpg", size: "cover", pos: "50% 40%" },
    Sean: { src: "art/sean_face.jpg", size: "cover", pos: "50% 35%" }
  };
  function paintFace(el, name) {
    const p = PORTRAITS[name];
    el.hidden = !p;
    if (!p) return;
    el.style.backgroundImage = `url("${p.src}")`; el.style.backgroundSize = p.size; el.style.backgroundPosition = p.pos;
    el.setAttribute("role", "img"); el.setAttribute("aria-label", name);
  }
  function show(sp, text) {
    const known = LABEL[sp];
    paintFace(portrait, sp === "SIS" ? sis() : sp === "S" ? "Sean" : sp);
    who.textContent = known ? known() : sp;
    who.className = known && sp !== "Harrow" ? sp : "";
    line.textContent = text;
    line.className = known && sp !== "Harrow" ? sp : "";
  }
  let advance = null;
  function say(sp, text) {
    return new Promise(res => {
      show(sp, text);
      choices.innerHTML = "";
      tap.hidden = false;
      box.classList.add("waiting");
      let done = false;
      advance = () => { if (done) return; done = true; advance = null; hush(); tap.hidden = true; box.classList.remove("waiting"); res(); };
      const mine = advance;
      const spoken = speak(sp, text);
      if (autoOn) {
        const minRead = 900 + text.length * 38;
        Promise.all([spoken, new Promise(r => setTimeout(r, voiceOn ? 250 : minRead))]).then(() => { if (advance === mine) setTimeout(() => { if (advance === mine) mine(); }, 350); });
      }
    });
  }
  async function lines(list) { for (const [sp, t] of list) await say(sp, t); }
  function choose(prompt, opts) {
    return new Promise(res => {
      hush();
      show("", prompt); line.className = "N"; portrait.hidden = true;
      tap.hidden = true; choices.innerHTML = "";
      if (prompt) speak("N", prompt);
      opts.forEach((o, i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.innerHTML = '<span class="k">' + (i + 1) + "</span>";
        b.appendChild(document.createTextNode(o));
        b.addEventListener("click", e => { e.stopPropagation(); hush(); choices.innerHTML = ""; res(i); });
        choices.appendChild(b);
      });
      choices.firstChild.focus({ preventScroll: true });
    });
  }
  function idleText(text) {
    advance = null; tap.hidden = true; choices.innerHTML = ""; box.classList.remove("waiting");
    show("", text); line.className = "N"; portrait.hidden = true;
  }
  box.addEventListener("click", () => { if (advance) advance(); });
  document.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && advance && !choices.childElementCount) { e.preventDefault(); advance(); }
    if (/^[1-9]$/.test(e.key) && choices.childElementCount) { const b = choices.children[+e.key - 1]; if (b) b.click(); }
    if (!steerEl.hidden && (e.key === "ArrowLeft" || e.key === "ArrowRight")) { e.preventDefault(); GW().ev("steer", e.key === "ArrowLeft" ? -1 : 1); }
  });
  const wait = ms => new Promise(r => setTimeout(r, ms));

  // ---------- scenes ----------
  function scene2d(key, data) {
    closeVerbs();
    if (W && W.active) W.hide();
    world2d.style.visibility = "";
    ART.show(key, S, data);
    return Promise.resolve();
  }
  let fallback = false;
  async function scene3d(key, opts) {
    closeVerbs();
    if (W) {
      world2d.style.visibility = "hidden";
      W.load(key, S, opts || {});
      fallback = false;
    } else {
      // Without 3D graphics the story still plays: a painted backdrop and a list of things to tap.
      world2d.style.visibility = "";
      ART.show("frame", S);
      fallback = true;
    }
  }
  async function card(kicker, name, sub) {
    await scene2d("card", { kicker, name });
    where.textContent = "";
    if (sub) await say("CAP", sub);
  }

  // ---------- inventory ----------
  let cfg = null, finishPlay = null;
  function itemName(id) { return (cfg && cfg.items && cfg.items[id]) || ({ chart: "Chart", packet: "Shannon's packet", coat: "Coat", sword: "Nightforge", pistol: "Mercer's pistol", olive: "Olive" })[id] || id; }
  function renderInv() {
    inv.hidden = !cfg || !S.inv.length;
    inv.innerHTML = '<span class="label">Carrying</span>';
    S.inv.forEach(id => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = itemName(id);
      if (S.sel === id) b.classList.add("sel");
      b.addEventListener("click", e => { e.stopPropagation(); if (S.busy || !cfg) return; openVerbs(id, itemName(id), ["Look", "Use on…"], true); });
      inv.appendChild(b);
    });
  }
  function renderChips() {
    if (!cfg || cfg.quick) { chips.hidden = true; return; }
    const ids = Object.keys(cfg.hs).filter(id => fallback || !W || GW().hotspots().includes(id));
    chips.hidden = !ids.length;
    chips.innerHTML = '<span class="label">Things here</span>';
    ids.forEach(id => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = cfg.hs[id][0]; b.dataset.hs = id;
      b.addEventListener("click", e => { e.stopPropagation(); tapHotspot(id, null); });
      chips.appendChild(b);
    });
  }
  const give = id => { if (!S.inv.includes(id)) S.inv.push(id); renderInv(); };
  const drop = id => { S.inv = S.inv.filter(x => x !== id); if (S.sel === id) S.sel = null; renderInv(); };
  const has = id => S.inv.includes(id);
  function refresh() { GW().refresh(S); renderInv(); renderChips(); }

  // ---------- verbs ----------
  let verbsEl = null;
  function closeVerbs() { if (verbsEl) { verbsEl.remove(); verbsEl = null; } }
  function openVerbs(id, name, verbs, isItem, pt) {
    closeVerbs();
    verbsEl = document.createElement("div");
    verbsEl.id = "verbs";
    verbsEl.innerHTML = `<div class="vname">${name}</div>`;
    verbs.forEach(v => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = v;
      b.addEventListener("click", e => {
        e.stopPropagation(); closeVerbs();
        if (isItem) return itemVerb(id, v);
        run(async () => {
          if (v === "Look") { GW().faceTo(id); return cfg.look ? cfg.look(id) : null; }
          await GW().goTo(id);
          if (v !== "Talk") await GW().gesture();
          return cfg.act(id, v);
        });
      });
      verbsEl.appendChild(b);
    });
    stage.appendChild(verbsEl);
    const r = stage.getBoundingClientRect();
    const x = pt ? pt.x - r.left : r.width / 2, y = pt ? pt.y - r.top : r.height / 2;
    const w = verbsEl.offsetWidth, h = verbsEl.offsetHeight;
    verbsEl.style.left = Math.max(6, Math.min(r.width - w - 6, x - w / 2)) + "px";
    verbsEl.style.top = Math.max(6, Math.min(r.height - h - 6, y - h - 10)) + "px";
    verbsEl.querySelector("button").focus({ preventScroll: true });
  }
  function itemVerb(id, v) {
    if (v === "Look") { run(() => cfg.lookItem ? cfg.lookItem(id) : say("N", itemName(id) + ".")); return; }
    S.sel = id; renderInv();
    idleText("Use " + itemName(id) + " on what? Tap something.");
  }
  function tapHotspot(id, pt) {
    if (!cfg || S.busy || !cfg.hs[id]) return;
    if (S.sel) {
      const item = S.sel; S.sel = null; renderInv();
      run(async () => { await GW().goTo(id); await GW().gesture(); return cfg.useOn ? cfg.useOn(item, id) : say("N", NOPE1); });
      return;
    }
    if (cfg.quick) { run(() => cfg.act(id, "Act")); return; }
    openVerbs(id, cfg.hs[id][0], cfg.hs[id][1], false, pt);
  }
  const NOPE1 = "That isn't how it happened. Try something that did.";

  // Tremor: after Bellgrave his right hand shakes. Taps land a little off.
  let tremor = false;
  stage.addEventListener("click", e => {
    if (advance) { advance(); return; }
    if (!steerEl.hidden) { const r = stage.getBoundingClientRect(); GW().ev("steer", e.clientX < r.left + r.width / 2 ? -1 : 1); return; }
    if (!cfg || S.busy || !W || !W.active) { closeVerbs(); return; }
    let ev = e;
    if (tremor) ev = { clientX: e.clientX + (Math.random() - .5) * 26, clientY: e.clientY + (Math.random() - .5) * 26 };
    const hit = W.pick(ev);
    if (hit.hs) { tapHotspot(hit.hs, { x: e.clientX, y: e.clientY }); return; }
    const hadMenu = !!verbsEl;
    closeVerbs();
    if (S.sel) { S.sel = null; renderInv(); idleText(cfg.objective()); return; }
    if (!hadMenu && hit.floor && !cfg.quick) W.walkTo(hit.floor);
  });

  async function run(fn) {
    if (S.busy) return;
    S.busy = true;
    clearGlow();
    try { await fn(); } finally {
      S.busy = false;
      if (cfg) { refresh(); idleText(cfg.objective()); armIdle(); }
    }
  }

  // ---------- hints ----------
  let idleTimer = null;
  function clearGlow() { clearTimeout(idleTimer); GW().setGlow(null); chips.querySelectorAll(".sel").forEach(b => b.classList.remove("sel")); }
  function glowOn(id) {
    if (!id) return;
    GW().setGlow(id);
    const c = chips.querySelector(`[data-hs="${id}"]`); if (c) c.classList.add("sel");
  }
  function armIdle() {
    clearTimeout(idleTimer);
    if (!cfg || (S.player !== "hazel" && !cfg.quick)) return;
    idleTimer = setTimeout(() => glowOn(cfg.target && cfg.target()), cfg.quick ? 6000 : 20000);
  }
  hintBtn.addEventListener("click", () => {
    if (!cfg || S.busy) return;
    run(() => say("N", cfg.hint ? cfg.hint() : cfg.objective())).then(() => glowOn(cfg.target && cfg.target()));
  });

  // ---------- free play ----------
  let ticker = null;
  function play(c) {
    cfg = c;
    S.sel = null;
    where.textContent = c.where || "";
    hintBtn.hidden = false;
    if (W) W.allowed = id => !!(cfg && cfg.hs[id]);
    refresh();
    idleText(c.objective());
    armIdle();
    clearInterval(ticker);
    if (c.tick) ticker = setInterval(() => { if (cfg === c && !S.busy) run(() => c.tick()); }, 400);
    return new Promise(res => { finishPlay = res; });
  }
  function finish() {
    clearInterval(ticker);
    const r = finishPlay; finishPlay = null;
    cfg = null; S.sel = null;
    if (W) W.allowed = null;
    clearGlow(); closeVerbs();
    hintBtn.hidden = true; chips.hidden = true; inv.hidden = true;
    if (r) setTimeout(r, 0);
  }

  // ---------- special moments ----------
  async function reef(opts) {
    steerEl.hidden = false;
    idleText("Steer through the smoke.");
    const res = await GW().ev("reef", opts);
    steerEl.hidden = true;
    return res || { done: true };
  }
  $("steerL").addEventListener("click", e => { e.stopPropagation(); GW().ev("steer", -1); });
  $("steerR").addEventListener("click", e => { e.stopPropagation(); GW().ev("steer", 1); });
  function controls(on) { menuBtn.hidden = !on; }
  function newspaper() {
    paper.innerHTML = `<div class="mast">THE CENTRAL AUTHORITY DISPATCH</div>
      <h3>BLACKSTEEL BUTCHER DESTROYS FLEET RELIEF FORCE</h3>
      <div class="cols">
        <div><div class="pic" role="img" aria-label="A blurred surveillance image of a man in a harbor, darkness wrapped around his sword"></div>
          <p><i>Surveillance image: the pirate in Bellgrave's harbor.</i></p></div>
        <div><p>A pirate attack on an innocent archaeological mission has claimed the lives of thirty-one loyal Fleet troopers. The attacker kidnapped an unidentified child and destroyed Bellgrave while attempting to steal a Central Authority artifact.</p>
          <p>Lieutenant Deke is praised as a heroic officer, killed defending civilians from the pirate's black steel.</p>
          <div class="bounty">WANTED, DEAD OR ALIVE<b>310,000,000</b>&ldquo;BLACKSTEEL&rdquo;</div></div>
      </div>`;
    paper.hidden = false;
    return new Promise(res => {
      speak("CAP", "Blacksteel Butcher destroys Fleet relief force.");
      const close = e => { e.stopPropagation(); paper.hidden = true; paper.removeEventListener("click", close); res(); };
      paper.addEventListener("click", close);
      idleText("Tap the newspaper to put it down.");
    });
  }

  async function lily() {
    where.textContent = "Bellgrave";
    await scene2d("lily");
    await lines([
      ["CAP", "On the last morning Bellgrave Island existed, Lily woke to the smell of cinnamon bread and her mother singing badly in the next room."],
      ["CAP", "Like every bell carved or painted on Bellgrave, the tiny bells on her ceiling beam had no clappers. Lily had once asked why. Her mother said bells did not need tongues when an island already knew its own name."],
      ["Lily's mother", "Lily. If I have to come in there, I'm bringing the cold washcloth."],
      ["CAP", "Lily pulled her blanket over her head. One small hand stayed outside it, holding a cloth doll by the waist."],
      ["Lily's mother", "The bread is already out. Your uncle has threatened to eat your piece, and I believe him capable of it."],
      ["Lily", "He always says that."],
      ["Lily's mother", "Today he brought jam."],
      ["Lily", "Red jam?"],
      ["Lily's mother", "The very reddest."]
    ]);
    await scene2d("village");
    await lines([
      ["CAP", "Outside, Bellgrave was beginning its day. Fishermen rolled barrels toward the harbor, arguing about a catch none of them had actually seen."],
      ["CAP", "Children chased one another between bright houses built in widening rings around the old hilltop shrine. Someone practiced the same four notes on a flute. Someone else shouted for him to learn a fifth."],
      ["CAP", "At the well, the oldest residents talked about the tremor that had woken them before dawn. Nothing had broken badly enough to interrupt breakfast, so they moved on to whose goat had eaten the magistrate's laundry."]
    ]);
    await scene2d("porch");
    await lines([
      ["CAP", "Lily ate on the porch steps with her doll propped beside her plate. Its yellow dress had faded to the color of old straw. One button eye was brown. The other was blue."],
      ["CAP", "Far offshore, shapes rested inside a bank of fog."]
    ]);
    await scene2d("fog");
    await lines([["Lily", "Mama, are those ships?"], ["CAP", "Her mother squinted toward the horizon. For a moment, her hands stopped moving in Lily's hair."]]);
    await scene2d("bell");
    await lines([["CAP", "Then a bell began to ring."], ["CAP", "Bellgrave had no bell tower."], ["CAP", "The sound came from beneath the island."]]);
    await scene2d("burning");
    await say("CAP", "By the time Sean Cooke found Bellgrave, the island was already burning.");
    where.textContent = "";
    await scene2d("frame");
    await say("N", "But that's three nights later. Three nights earlier, he was eating dinner on top of a chart.");
  }

  const G = {
    S, me, sis, say, lines, choose, wait, card, lily, scene2d, scene3d, play, finish, give, drop, has, refresh,
    reef, controls, newspaper,
    tremor(on) { tremor = on; },
    // for automated play-testing
    debugTarget: () => (cfg && cfg.target ? cfg.target() : null),
    debugQuick: () => !!(cfg && cfg.quick),
    playing: () => !!cfg,
    get W() { return GW(); }
  };
  window.__G = G;

  // ---------- the story ----------
  async function runStory() {
    for (let i = S.ch; i < STORY.length; i++) {
      S.ch = i; save();
      await STORY[i].run(G);
    }
    S.ch = STORY.length; save();
    await card("The End", "of the Prologue");
    idleText("The Island That Never Existed. Tap Menu to play again, or to let your sister have a turn.");
  }

  // ---------- title ----------
  function showTitle() {
    S.player = null; S.busy = false; S.sel = null; cfg = null; advance = null;
    hush(); clearGlow(); closeVerbs(); clearInterval(ticker);
    inv.hidden = chips.hidden = hintBtn.hidden = menuBtn.hidden = true; steerEl.hidden = true; paper.hidden = true;
    where.textContent = "";
    scene2d("title");
    const block = p => {
      const sv = load(p);
      const resumable = sv && sv.ch > 0 && sv.ch < STORY.length;
      return `<div class="p">
        ${PORTRAITS[NAMES[p]] ? `<div class="face" data-face="${NAMES[p]}"></div>` : ""}
        <button type="button" class="big" data-play="${p}">${NAMES[p]}</button>
        ${resumable ? `<button type="button" class="small" data-restart="${p}">Start over (now at Chapter ${sv.ch + 1})</button>` : ""}
      </div>`;
    };
    title.innerHTML = `<h2>The Island That Never Existed</h2>
      <div class="sub">A Blacksteel Pirates prologue, as told by Shannon</div>
      <div class="who">Who's playing tonight?</div>
      <div class="players">${block("olive")}${block("hazel")}</div>`;
    title.hidden = false;
    title.querySelectorAll("[data-face]").forEach(el => paintFace(el, el.dataset.face));
    idleText(W ? "Each of you has your own game and your own save. Whoever isn't playing will be in the story, listening." : "This device can't show the 3D scenes, so the story plays with paintings and a list of things to tap.");
    title.querySelectorAll("[data-play]").forEach(b => b.addEventListener("click", () => begin(b.dataset.play, false)));
    title.querySelectorAll("[data-restart]").forEach(b => b.addEventListener("click", () => begin(b.dataset.restart, true)));
  }
  let gen = 0;
  function begin(p, restart) {
    if (restart) wipe(p);
    // Browsers only allow speech after a tap: this tap unlocks it.
    if (synth && voiceOn) { try { synth.speak(new SpeechSynthesisUtterance(" ")); } catch (e) { /* ignore */ } }
    S.player = p;
    const sv = load(p);
    S.ch = sv && sv.ch < STORY.length ? sv.ch : 0;
    S.stage = 0; S.flags = {}; S.inv = [];
    title.hidden = true; menuBtn.hidden = false;
    const mine = ++gen;
    runStory().catch(err => { if (mine === gen) { console.error(err); idleText("Something went wrong. Tap Menu to go back."); } });
  }
  menuBtn.addEventListener("click", () => { gen++; finishPlay = null; finish(); showTitle(); });

  ART.preload();
  showTitle();
})();
</script>
