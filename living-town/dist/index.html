<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10192b">
  <meta name="description" content="A small persistent town that keeps living while you are away.">
  <title>Living Town</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310192b'/%3E%3Cpath d='M10 31 32 13l22 18v23H10z' fill='%23f5b942'/%3E%3Cpath d='M27 54V38h10v16' fill='%2310192b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">CANON WORLD</p>
        <h1>Living Town</h1>
      </div>
      <div class="clock-block" aria-live="polite">
        <strong id="worldClock">--:--</strong>
        <span id="worldDate">Loading town…</span>
      </div>
    </header>

    <section class="game-layout">
      <div class="world-card">
        <canvas id="townCanvas" width="960" height="640" aria-label="Living Town map"></canvas>
        <div class="world-toolbar" aria-label="Town controls">
          <button class="mode-button active" data-mode="observe">Observe</button>
          <button class="mode-button" data-mode="olive">Play as Olive</button>
          <button class="mode-button" data-mode="dad">Play as Sean</button>
          <label class="speed-control">
            <span>Clock</span>
            <select id="speedSelect" aria-label="Simulation speed">
              <option value="1">Real time</option>
              <option value="60">Demo: 1 min/sec</option>
              <option value="360">Demo: 6 min/sec</option>
            </select>
          </label>
        </div>
      </div>

      <aside class="side-panel">
        <section class="resident-card" aria-live="polite">
          <div class="resident-heading">
            <div id="residentPortrait" class="portrait">?</div>
            <div>
              <p class="eyebrow">CURRENTLY WATCHING</p>
              <h2 id="residentName">Select a resident</h2>
              <p id="residentActivity">Tap someone in town.</p>
            </div>
          </div>
          <div id="needsPanel" class="needs-panel"></div>
          <div class="resident-detail-grid">
            <div><span>Closest friend</span><strong id="closestFriend">—</strong></div>
            <div><span>Memories</span><strong id="memoryCount">—</strong></div>
          </div>
          <p id="latestMemory" class="latest-memory">No memory selected.</p>
        </section>

        <section class="story-card">
          <div class="section-heading">
            <div>
              <p class="eyebrow">OBSERVER FEED</p>
              <h2>Today in town</h2>
            </div>
            <button id="findStory" class="secondary-button">Find a scene</button>
          </div>
          <ol id="eventFeed" class="event-feed"></ol>
        </section>

        <section id="returnCard" class="return-card hidden">
          <p class="eyebrow">WHILE YOU WERE AWAY</p>
          <h2>The town kept moving</h2>
          <ul id="returnEvents"></ul>
          <button id="dismissReturn" class="primary-button">Back to town</button>
        </section>

        <section class="save-card">
          <span id="saveStatus">Town saved locally</span>
          <button id="resetTown" class="text-button">Reset prototype</button>
        </section>
      </aside>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
