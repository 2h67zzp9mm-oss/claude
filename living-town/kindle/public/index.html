<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kindle">
<meta name="theme-color" content="#05070f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Kindle's Grid</title>
<style>
  :root { --bg: #05070f; --ink: #dff8ff; --glow: #57e1ff; --card: #0b1a26; --line: #57e1ff44; --gold: #ffd36b; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 20%, #10304a, var(--bg) 60%); color: var(--ink); font: 500 1rem/1.35 system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); }
  header { text-align: center; }
  header img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 0 24px #57e1ff55; }
  h1 { margin: 4px 0 0; font-size: 1.4rem; color: var(--glow); }
  header p { margin: 4px 0 0; opacity: .8; font-size: .9rem; }
  main { flex: 1; overflow: auto; margin: 14px 0; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; opacity: .7; margin: 14px 0 6px; }
  .wish { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
  .wish p { margin: 0 0 8px; } .wish small { opacity: .65; } .wish.done { opacity: .6; }
  .row { display: flex; gap: 8px; }
  button, .btn { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: #0d2c38; color: var(--ink); font: 600 1rem system-ui; padding: 0 14px; flex: 1; text-decoration: none; display: flex; align-items: center; justify-content: center; }
  .big { background: #1a9c6b; border-color: #2fd393; }
  footer { display: flex; flex-direction: column; gap: 8px; }
  select, input { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: #04141a; color: var(--ink); font: 500 1rem system-ui; padding: 0 12px; width: 100%; margin-bottom: 8px; }
  .note { font-size: .85rem; opacity: .75; text-align: center; margin: 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header><img src="icon-192.png" alt=""><h1 id="title">Kindle's Grid</h1><p id="sub">A little world of light</p></header>
<main id="main"></main>
<footer id="foot"></footer>
<script>
const $ = s => document.querySelector(s), esc = v => String(v || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const api = async (url, body) => { const r = await fetch(url, { method: body ? "POST" : "GET", credentials: "same-origin", headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined }); return { ok: r.ok, status: r.status, data: await r.json().catch(() => ({})) }; };
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
let me = null;
async function start() {
  const s = (await api("/api/auth/status")).data; me = s.me;
  if (!me) return signIn(s.profiles || []);
  home();
}
function signIn(profiles) {
  $("#main").innerHTML = `<h2>Who's visiting?</h2><select id="who">${profiles.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("")}</select><input id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="current-password"><p class="note" id="err"></p>`;
  $("#foot").innerHTML = `<button class="big" id="go">Sign in</button>`;
  $("#go").onclick = async () => { const r = await api("/api/auth/login", { profileId: $("#who").value, pin: $("#pin").value }); if (r.ok) start(); else $("#err").textContent = r.data.error || "That didn't work."; };
}
async function home() {
  const w = (await api("/api/wishes")).data, name = w.name || "Kindle";
  $("#title").textContent = `${name}'s Grid`; document.title = `${name}'s Grid`;
  const open = (w.wishes || []).filter(x => x.status === "open"), past = (w.wishes || []).filter(x => x.status !== "open").slice(0, 6);
  $("#sub").textContent = open.length ? `${name} has ${open.length === 1 ? "a wish" : open.length + " wishes"} for you` : `${name} is living his life`;
  $("#main").innerHTML = `<h2>✨ Wishes</h2>${open.map(x => `<div class="wish"><p>${esc(x.text)}</p><small>${new Date(x.at).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" })}</small>${w.canAnswer ? `<div class="row" style="margin-top:8px"><button class="big" data-yes="${esc(x.id)}">✅ Yes</button><button data-no="${esc(x.id)}">Not now</button></div>` : ""}</div>`).join("") || `<p class="note">No wishes right now.</p>`}` +
    (past.length ? `<h2>Answered</h2>${past.map(x => `<div class="wish done"><p>${x.status === "yes" ? "✅" : "💤"} ${esc(x.text)}</p></div>`).join("")}` : "");
  document.querySelectorAll("[data-yes],[data-no]").forEach(b => b.onclick = async () => { b.disabled = true; await api(`/api/wishes/${b.dataset.yes || b.dataset.no}`, { answer: b.dataset.yes ? "yes" : "no" }); home(); });
  const granted = window.Notification && Notification.permission === "granted" && w.push.phones;
  const bell = w.canAnswer ? (granted ? `<button id="test">🔔 Notifications are on · test</button>` : `<button id="bell">🔔 Turn on notifications</button>`) : "";
  $("#foot").innerHTML = `${bell}<button id="wx">☁️ Hey ${esc(name)}, what's the weather like?</button><a class="btn big" href="grid/">◈ Visit the Grid</a><a class="btn" href="https://m0u5-3.tail9b0a79.ts.net/">↩️ Games Menu</a>`;
  $("#bell") && ($("#bell").onclick = () => standalone && window.Notification ? turnOn(w.push.key) : howTo());
  $("#wx").onclick = () => askWeather();
  $("#test") && ($("#test").onclick = async () => { const r = await api("/api/push/test", {}); $("#test").textContent = r.data.sent ? "🔔 Sent! Check your phone" : "🔔 Didn't go through"; });
}
// "Hey, what's the weather like?" (the ☁️ button, or press W): his answer shows at the top of the wishes.
async function askWeather() {
  const b = $("#wx"); if (!b || b.disabled) return; b.disabled = true;
  const r = await api("/api/glint/weather", {}), card = document.createElement("div");
  card.className = "wish"; card.innerHTML = `<p>◈ <b>${esc(r.data.name || "Kindle")}:</b> ${esc(r.ok ? r.data.reply : (r.data.error || "He didn't hear you. Try again."))}</p>`;
  $("#wx-say")?.remove(); card.id = "wx-say"; $("#main").prepend(card); $("#main").scrollTop = 0; b.disabled = false;
}
addEventListener("keydown", e => { if (e.key.toLowerCase() === "w" && !e.metaKey && !e.ctrlKey && !e.altKey && !/input|select|textarea/i.test(e.target.tagName)) askWeather(); });
// iPhones only let home-screen apps send notifications, so first: put Kindle on the home screen.
function howTo() {
  $("#main").innerHTML = `<h2>🔔 Turn on notifications</h2>
    <div class="wish"><p><b>1.</b> Tap the <b>Share</b> button in Safari (the square with an arrow ⬆️, at the bottom of the screen; on some phones it's behind the <b>⋯</b> button).</p></div>
    <div class="wish"><p><b>2.</b> Scroll down and tap <b>Add to Home Screen</b>, then <b>Add</b>.</p></div>
    <div class="wish"><p><b>3.</b> Close Safari and open <b>Kindle</b> from your home screen (his face is the icon).</p></div>
    <div class="wish"><p><b>4.</b> Sign in, tap <b>🔔 Turn on notifications</b> again, and tap <b>Allow</b>. A test one will pop up.</p></div>`;
  $("#foot").innerHTML = `<button id="back">Back</button>`; $("#back").onclick = home;
}
async function turnOn(key) {
  try {
    if (await Notification.requestPermission() !== "granted") return alert("Notifications are off. You can turn them on in Settings.");
    const reg = await navigator.serviceWorker.ready, raw = Uint8Array.from(atob(key.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: raw });
    await api("/api/push/subscribe", sub.toJSON()); await api("/api/push/test", {}); home();
  } catch (e) { alert("Couldn't turn on notifications: " + e.message); }
}
start();
</script>
</body>
</html>
