<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15243b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Living Town</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="map.css" />
    <link rel="stylesheet" href="accounts.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <button id="profileButton" class="avatar-button" aria-label="Player profile"><span id="profileInitial">★</span></button>
        <div class="town-title"><span>Living Town</span><small id="connectionStatus">Connecting…</small></div>
        <div class="clock-block"><strong id="worldClock">--:--</strong><span id="worldDate">Loading town</span></div>
      </header>

      <section class="world-card">
        <canvas id="townCanvas" aria-label="Living Town map"></canvas>
        <div class="place-chip" id="placeChip">Living Town</div>
        <div class="zoom-hint">Drag to explore · Pinch to zoom · Tap to move</div>
        <button id="recenterButton" class="map-button" aria-label="Center map">⌖</button>
      </section>

      <section id="residentSheet" class="bottom-sheet" aria-live="polite">
        <div class="sheet-handle"></div>
        <div class="resident-heading">
          <div id="residentPortrait" class="portrait">?</div>
          <div class="resident-copy">
            <p class="eyebrow">RESIDENT</p>
            <h1 id="residentName">Select someone</h1>
            <p id="residentActivity">Tap a resident to check in.</p>
            <p id="residentIntent" class="intent"></p>
          </div>
          <button id="editResident" class="circle-button hidden" aria-label="Customize this character">✎</button>
          <button id="expandSheet" class="circle-button" aria-label="Expand resident details">⌃</button>
        </div>
        <div class="quick-stats">
          <div><span>Mood</span><strong id="residentMood">—</strong></div>
          <div><span>Age</span><strong id="residentAge">—</strong></div>
          <div><span>Closest</span><strong id="closestFriend">—</strong></div>
        </div>
        <div id="sheetDetails" class="sheet-details">
          <div id="needsPanel" class="needs-panel"></div>
          <p id="profileSummary" class="profile-summary"></p>
          <div class="life-status">
            <span>Life</span><strong id="residentCareer">—</strong>
            <span>Goal</span><strong id="residentGoal">—</strong>
            <div class="goal-track"><div id="goalProgress" class="goal-fill"></div></div>
          </div>
          <div class="family-block"><span>Family</span><p id="residentFamily">—</p></div>
          <p id="latestMemory" class="latest-memory"></p>
          <div class="detail-tabs">
            <button class="detail-tab active" data-panel="eventsPanel">Town feed</button>
            <button class="detail-tab" data-panel="historyPanel">History</button>
            <button class="detail-tab" data-panel="knowledgePanel">Learned</button>
          </div>
          <div id="eventsPanel" class="detail-panel active">
            <ol id="eventFeed" class="event-feed"></ol>
            <button id="findStory" class="wide-button">Find someone interesting</button>
          </div>
          <div id="historyPanel" class="detail-panel">
            <p id="memoryCount" class="panel-note"></p>
            <ol id="lifeHistory" class="history-list"></ol>
          </div>
          <div id="knowledgePanel" class="detail-panel"><ul id="knowledgeList" class="knowledge-list"></ul></div>
        </div>
      </section>

      <nav class="dock" aria-label="Town navigation">
        <button class="dock-button active" data-mode="observe"><b>⌂</b><span>Town</span></button>
        <button class="dock-button" id="playButton" data-mode="play"><b>➤</b><span>Play</span></button>
        <button class="dock-button" id="peopleButton"><b>♟</b><span>People</span></button>
        <button class="dock-button" id="storiesButton"><b>✦</b><span>Stories</span></button>
      </nav>

      <section id="returnCard" class="modal-card hidden">
        <p class="eyebrow">WHILE YOU WERE AWAY</p>
        <h2>The town kept living</h2>
        <ul id="returnEvents"></ul>
        <button id="dismissReturn" class="wide-button">Back to town</button>
      </section>
      <div id="toast" class="toast hidden" role="status"></div>
    </main>
    <script src="shared/world.js"></script>
    <script src="client.js"></script>
  </body>
</html>
